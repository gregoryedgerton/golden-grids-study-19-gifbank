<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Title, description and icon are written by study.meta.ts from src/study.json. -->
    <meta name="color-scheme" content="light dark" />
    <!-- The Display setting (Profile & Settings, Preferences), applied before the first paint. -->
    <script>try{var t=JSON.parse(localStorage.getItem("gg19b-settings")||"{}").theme;if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=block" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/pages/accounts.tsx"></script>
  </body>
</html>
